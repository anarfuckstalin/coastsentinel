[project]
name = "coastsentinel"
version = "1.0.0"
description = "Système d'Alerte Côtière Multi-échelle — moteur scientifique et API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Amine Bouhadi", email = "amine.bouhadi@etu.uae.ac.ma" }]
keywords = ["coastal", "hazard", "early-warning", "oceanography", "runup"]

dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.38",
    "httpx>=0.28",
    "pydantic>=2.12",
    "orjson>=3.11",
]

[project.optional-dependencies]
science = ["scipy>=1.14", "numpy>=2.0"]
era5 = ["cdsapi>=0.7", "xarray>=2024.7", "netCDF4>=1.7"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.14"]

[project.scripts]
coastsentinel = "coastsentinel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coastsentinel"]

[tool.ruff]
line-length = 100
target-version = "py311"
# tools/ regroupe les scripts scientifiques autonomes hérités de la version 1 :
# ils gardent leur style d'origine et ne font pas partie du paquet installé.
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
